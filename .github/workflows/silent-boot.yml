name: silent-boot

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "silent-boot/**"
      - "silent/**"
      - ".github/workflows/silent-boot.yml"
  push:
    branches:
      - main
    paths:
      - "silent-boot/**"
      - "silent/**"
      - ".github/workflows/silent-boot.yml"

jobs:
  check:
    strategy:
      matrix:
        platform: [ ubuntu-latest ]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: silent-boot
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable
      - uses: Swatinem/rust-cache@v1
        with:
          workspaces: silent-boot
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Check code format
        run: cargo fmt --all -- --check
      - name: Lint rust sources with all features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Lint rust sources with the core feature set
        run: cargo clippy -p silent-boot --all-targets --no-default-features --features sqlite -- -D warnings
      # MySQL 与 PostgreSQL 只保证能编译，不在 CI 里连真实的数据库（PLAN.md 的 D14）。
      - name: Lint rust sources with the MySQL and PostgreSQL features
        run: cargo clippy -p silent-boot --all-targets --no-default-features --features mysql,postgres,cli -- -D warnings
      - name: Execute rust tests
        run: cargo nextest run --workspace --all-features

  msrv:
    strategy:
      matrix:
        platform: [ ubuntu-latest ]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: silent-boot
    steps:
      - uses: actions/checkout@v4
      # SeaORM 2.0 要求的最低版本，见 silent-boot/PLAN.md 的"技术选型"。
      - name: Install Rust 1.94
        run: rustup toolchain install 1.94 --profile minimal
      - uses: Swatinem/rust-cache@v1
        with:
          workspaces: silent-boot
      - name: Check with the minimum supported Rust version
        run: cargo +1.94 check --workspace --all-features --all-targets
  # examples/demo 是用 `silent-boot new` 生成之后提交的：守着模板不腐化，也是"生成出来就能跑"的证据。
  example:
    strategy:
      matrix:
        platform: [ ubuntu-latest ]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: silent-boot
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable
      - uses: Swatinem/rust-cache@v1
        with:
          workspaces: silent-boot
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: The committed example is exactly what `silent-boot new` generates
        working-directory: silent-boot/examples
        run: |
          cargo run -q -p silent-boot-cli -- new demo --path-framework ../crates/silent-boot --path-silent ../../silent --force
          git diff --exit-code -- demo
      - name: Lint the example
        run: cargo clippy --manifest-path examples/demo/Cargo.toml --all-targets -- -D warnings
      - name: Test the example
        run: cargo nextest run --manifest-path examples/demo/Cargo.toml
      # 应用子命令从当前目录向上找 silent-boot.toml 来定位应用根目录，所以要在应用目录里执行。
      - name: The entity files are what `generate entity` produces for the example schema
        working-directory: silent-boot/examples/demo
        run: |
          cargo run -q -- migrate up
          cargo run -q --features codegen -- generate entity --dry-run > entity.log
          cat entity.log
          ! grep -q "would change" entity.log
