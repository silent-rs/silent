[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
authors = ["Hubert Shelley <hubertshelley@163.com>"]
repository = "https://github.com/silent-rs/silent"
publish = false

[workspace.dependencies]
silent = { path = "../silent" }
sea-orm = { version = "2.0.4", default-features = false, features = [
    "macros",
    "runtime-tokio",
    "with-chrono",
    "with-json",
] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = [
    "runtime-tokio",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
scru128 = "4"
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
thiserror = "2"
sea-orm-codegen = "=2.0.4"
sea-schema = { version = "0.18.1", default-features = false, features = [
    "discovery",
    "writer",
    "probe",
    "sqlx-sqlite",
    "runtime-tokio",
] }
sqlx = { version = "0.9.1", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
] }
